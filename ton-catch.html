<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Мистер Тон ловит TON</title>
<style>
  html, body { margin: 0; height: 100%; background: #16141c; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; width: min(100vw, 100vh, 600px); height: min(100vw, 100vh, 600px); border-radius: 18px; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="720" height="720"></canvas>
<script>
// Мини-игра TonExpress: ловишь падающие TON головой Мистера Тона.
// Всё в одном файле < 32 КБ, без сети и картинок — подходит и для HTML-сообщений Telegram.
(() => {
  const UK = /^uk/i.test(navigator.language || '');
  const T = UK ? {
    title: 'Містер Тон ловить TON', tap: 'Тапни, щоб почати', drag: 'Води пальцем: лови TON, тікай від червоних',
    best: 'Рекорд', score: 'Рахунок', again: 'Тапни — ще раз', newBest: 'Новий рекорд!', bot: '@tonexpressbot · обмін грн ⇄ TON',
  } : {
    title: 'Мистер Тон ловит TON', tap: 'Тапни, чтобы начать', drag: 'Води пальцем: лови TON, беги от красных',
    best: 'Рекорд', score: 'Счёт', again: 'Тапни — ещё раз', newBest: 'Новый рекорд!', bot: '@tonexpressbot · обмен грн ⇄ TON',
  };

  const cv = document.getElementById('c');
  const g = cv.getContext('2d');
  const W = 360, H = 360, K = cv.width / W;
  g.scale(K, K);

  let best = 0;
  try { best = +localStorage.getItem('tonCatchBest') || 0; } catch (e) {}

  // Голова Мистера Тона (вектор, 100×100), рисуется Path2D — без картинок.
  const HEAD = new Path2D('M22 6 L78 6 L97 30 L91 78 L64 100 L36 100 L9 78 L3 30 Z');
  const SHINE = new Path2D('M22 6 L78 6 L66 24 L34 24 Z');
  const SIDE = new Path2D('M78 6 L97 30 L91 78 L74 64 L70 26 Z');
  const SHADES = new Path2D('M8 36 H92 L89 48 Q87 58 78 58 H62 Q54 58 52 48 H48 Q46 58 38 58 H22 Q13 58 11 48 Z');
  const GRIN = new Path2D('M36 74 Q52 84 68 72');
  const SAD = new Path2D('M38 82 Q51 72 64 82');

  const state = { mode: 'menu', score: 0, lives: 3, x: W / 2, tx: W / 2, items: [], pops: [], t: 0, spawnIn: 0, mood: 0, shake: 0, newBest: false };
  let seed = 1;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };

  function reset() {
    Object.assign(state, { mode: 'play', score: 0, lives: 3, items: [], pops: [], t: 0, spawnIn: .4, mood: 0, shake: 0, newBest: false });
    seed = (Date.now() % 100000) + 1;
  }

  function spawn() {
    const lvl = Math.min(state.score / 40, 1);
    const r = rnd();
    const kind = r < .1 ? 'gold' : r < .1 + .16 + lvl * .14 ? 'bad' : 'ton';
    state.items.push({ kind, x: 22 + rnd() * (W - 44), y: -20, v: 110 + state.score * 3.2 + rnd() * 40, rot: rnd() * 6 });
  }

  function pop(x, y, text, color) { state.pops.push({ x, y, text, color, life: .8 }); }

  function hurt() {
    state.lives -= 1;
    state.mood = -1;
    state.shake = .3;
    try { navigator.vibrate && navigator.vibrate(60); } catch (e) {}
    if (state.lives <= 0) {
      state.mode = 'over';
      if (state.score > best) {
        best = state.score; state.newBest = true;
        try { localStorage.setItem('tonCatchBest', String(best)); } catch (e) {}
      }
    }
  }

  function update(dt) {
    state.x += (state.tx - state.x) * Math.min(1, dt * 14);
    state.mood *= Math.pow(.02, dt);
    state.shake = Math.max(0, state.shake - dt);
    for (const p of state.pops) { p.y -= 40 * dt; p.life -= dt; }
    state.pops = state.pops.filter((p) => p.life > 0);
    if (state.mode !== 'play') return;
    state.t += dt;
    state.spawnIn -= dt;
    if (state.spawnIn <= 0) {
      spawn();
      state.spawnIn = Math.max(.32, .95 - state.score * .012) * (.75 + rnd() * .5);
    }
    const hx = state.x, hy = H - 46;
    for (const it of state.items) {
      it.y += it.v * dt; it.rot += dt * 2;
      if (!it.done && it.y > hy - 30 && it.y < hy + 10 && Math.abs(it.x - hx) < 38) {
        it.done = true;
        if (it.kind === 'bad') { pop(it.x, it.y, '−1', '#ff6b6b'); hurt(); }
        else {
          const add = it.kind === 'gold' ? 3 : 1;
          state.score += add; state.mood = 1;
          pop(it.x, it.y, '+' + add, it.kind === 'gold' ? '#ffd93d' : '#7dd3ff');
        }
      } else if (!it.done && it.y > H + 20) {
        it.done = true;
        if (it.kind !== 'bad') hurt();
      }
    }
    state.items = state.items.filter((it) => !it.done);
  }

  function bg() {
    const gr = g.createLinearGradient(0, 0, 0, H);
    gr.addColorStop(0, '#4b4cca'); gr.addColorStop(.5, '#5f63d2'); gr.addColorStop(1, '#8474e0');
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    g.fillStyle = 'rgba(255,255,255,.07)';
    const off = (state.t * 12) % 64;
    for (let y = -64; y < H + 64; y += 64) for (let x = 0; x < W + 64; x += 64) {
      for (const [ox, oy] of [[16, 8], [48, 38]]) {
        const cx = x + ox, cy = y + oy + off;
        g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + 8, cy + 7); g.lineTo(cx, cy + 21); g.lineTo(cx - 8, cy + 7); g.fill();
      }
    }
  }

  function coin(it) {
    g.save(); g.translate(it.x, it.y);
    if (it.kind === 'bad') {
      g.fillStyle = '#ff5c6c'; g.strokeStyle = '#0d0620'; g.lineWidth = 3;
      g.beginPath(); g.arc(0, 0, 15, 0, 7); g.fill(); g.stroke();
      g.strokeStyle = '#fff'; g.lineWidth = 3.4; g.lineCap = 'round'; g.lineJoin = 'round';
      g.beginPath(); g.moveTo(-8, -7); g.lineTo(-2, 0); g.lineTo(2, -3); g.lineTo(8, 6); g.stroke();
      g.beginPath(); g.moveTo(3, 6); g.lineTo(8, 6); g.lineTo(8, 1); g.stroke();
    } else {
      const gold = it.kind === 'gold';
      g.rotate(Math.sin(it.rot) * .25);
      g.fillStyle = gold ? '#ffd93d' : '#0098ea'; g.strokeStyle = '#0d0620'; g.lineWidth = 3;
      g.beginPath(); g.arc(0, 0, gold ? 17 : 15, 0, 7); g.fill(); g.stroke();
      g.strokeStyle = gold ? '#0d0620' : '#fff'; g.lineWidth = 2.6; g.lineJoin = 'round';
      g.beginPath(); g.moveTo(-7, -5); g.lineTo(7, -5); g.lineTo(0, 8); g.closePath(); g.moveTo(0, -5); g.lineTo(0, 8); g.stroke();
    }
    g.restore();
  }

  function mascot(x, y, s, mood) {
    g.save(); g.translate(x - 50 * s, y - 50 * s); g.scale(s, s);
    g.fillStyle = '#2e2060'; g.fillRect(36, 96, 28, 30);
    g.fillStyle = '#ffd93d'; g.beginPath(); g.moveTo(47, 98); g.lineTo(53, 98); g.lineTo(55, 120); g.lineTo(50, 126); g.lineTo(45, 120); g.fill();
    g.fillStyle = '#7b5cf0'; g.fill(HEAD);
    g.fillStyle = '#a58cff'; g.fill(SHINE);
    g.fillStyle = 'rgba(40,20,110,.35)'; g.fill(SIDE);
    g.strokeStyle = '#0d0620'; g.lineWidth = 5; g.lineJoin = 'round'; g.stroke(HEAD);
    const lift = mood > .3 ? -6 * mood : 0;
    g.save(); g.translate(0, lift);
    g.fillStyle = '#07030f'; g.fill(SHADES);
    g.fillStyle = 'rgba(255,255,255,.22)'; g.fillRect(20, 40, 14, 5); g.fillRect(60, 40, 14, 5);
    g.restore();
    g.strokeStyle = '#0d0620'; g.lineWidth = 4.5; g.lineCap = 'round';
    g.stroke(mood < -.3 ? SAD : GRIN);
    g.restore();
  }

  function text(s, x, y, size, color, align) {
    g.font = `800 ${size}px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`;
    g.textAlign = align || 'center'; g.textBaseline = 'middle';
    g.lineWidth = Math.max(3, size / 6); g.strokeStyle = 'rgba(13,6,32,.85)'; g.lineJoin = 'round';
    g.strokeText(s, x, y); g.fillStyle = color || '#fff'; g.fillText(s, x, y);
  }

  function hud() {
    coin({ kind: 'ton', x: 30, y: 26, rot: 0 });
    text(String(state.score), 52, 26, 24, '#fff', 'left');
    for (let i = 0; i < 3; i++) heart(W - 26 - i * 26, 26, i < state.lives);
  }

  function heart(x, y, on) {
    g.save(); g.translate(x, y);
    g.beginPath(); g.moveTo(0, 8); g.bezierCurveTo(-14, -2, -8, -14, 0, -6); g.bezierCurveTo(8, -14, 14, -2, 0, 8);
    g.fillStyle = on ? '#ff5c6c' : 'rgba(255,255,255,.25)'; g.fill();
    g.strokeStyle = '#0d0620'; g.lineWidth = 2.5; g.stroke(); g.restore();
  }

  function overlay(lines) {
    g.fillStyle = 'rgba(22,20,28,.62)'; g.fillRect(0, 0, W, H);
    for (const [s, y, size, color] of lines) text(s, W / 2, y, size, color);
  }

  function draw() {
    g.save();
    if (state.shake > 0) g.translate((Math.random() - .5) * 8 * state.shake, 0);
    bg();
    for (const it of state.items) coin(it);
    mascot(state.x, H - 40, .62, state.mood);
    for (const p of state.pops) { g.globalAlpha = Math.min(1, p.life * 2); text(p.text, p.x, p.y, 20, p.color); g.globalAlpha = 1; }
    g.restore();
    if (state.mode === 'play') hud();
    if (state.mode === 'menu') {
      overlay([[T.title, 96, 26], [T.drag, 136, 14, '#e8e5ff'], [T.tap, 196, 22, '#ffd93d'],
        [best ? `${T.best}: ${best} TON` : '', 236, 16, '#e8e5ff'], [T.bot, 330, 13, '#cfc9ff']]);
    } else if (state.mode === 'over') {
      overlay([[state.newBest ? T.newBest : `${T.score}: ${state.score} TON`, 92, 20, state.newBest ? '#ffd93d' : '#fff'],
        [`${T.best}: ${best} TON`, 140, 34, '#fff'], [T.bot, 186, 15, '#cfc9ff'], [T.again, 240, 20, '#ffd93d']]);
    }
  }

  function point(e) {
    const r = cv.getBoundingClientRect();
    const px = ((e.touches ? e.touches[0].clientX : e.clientX) - r.left) / r.width * W;
    state.tx = Math.max(30, Math.min(W - 30, px));
  }
  cv.addEventListener('pointerdown', (e) => {
    point(e);
    if (state.mode !== 'play') { if (state.mode === 'over' && state.t < .1 && performance.now() - overAt < 600) return; reset(); }
  });
  cv.addEventListener('pointermove', (e) => { if (state.mode === 'play') point(e); });
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') state.tx = Math.max(30, state.tx - 40);
    if (e.key === 'ArrowRight') state.tx = Math.min(W - 30, state.tx + 40);
    if ((e.key === ' ' || e.key === 'Enter') && state.mode !== 'play') reset();
  });

  let last = performance.now(), overAt = 0, prevMode = state.mode;
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    update(dt);
    if (state.mode === 'over' && prevMode !== 'over') overAt = now;
    prevMode = state.mode;
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
